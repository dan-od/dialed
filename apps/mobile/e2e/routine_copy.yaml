# Flow 05 copy day: Monday → Tuesday and Thursday (classes stay, overlaps flagged), then Back → Discard dialog.
appId: me.okoro.dialed
---
- runFlow: _editor.yaml
- tapOn: { id: 'copy-day' }
- extendedWaitUntil: { visible: 'Copy Monday to', timeout: 5000 }
- tapOn: { id: 'cp-go' }
- extendedWaitUntil: { visible: 'Pick at least one day.', timeout: 5000 }
- tapOn: { id: 'cp-1' }
- tapOn: { id: 'cp-3' }
- extendedWaitUntil: { visible: 'Replaces what’s on Tue and Thu.', timeout: 5000 }
- takeScreenshot: copy-sheet-${THEME}
- tapOn: { id: 'cp-go' }
- extendedWaitUntil: { visible: 'Copied Monday to Tue, Thu. Save to keep it.', timeout: 5000 }
- tapOn: { id: 'rtab-1' }
- extendedWaitUntil: { visible: 'Every Tuesday', timeout: 5000 }
- waitForAnimationToEnd: { timeout: 2000 }
- takeScreenshot: copy-tuesday-${THEME}
- tapOn: 'Back to Routines'
- extendedWaitUntil: { visible: 'Discard routine changes?', timeout: 5000 }
- takeScreenshot: discard-routine-${THEME}
- tapOn: 'Discard'
- extendedWaitUntil: { visible: 'Your repeating weeks.*', timeout: 5000 }
