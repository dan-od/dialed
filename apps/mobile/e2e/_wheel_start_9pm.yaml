# Starts wheel (inline spinner under the time fields, large-detent sheet): from the default 10 pm, tap the 9 row
# (the end keeps the 1 h length), then tap the field again to close the wheel. iPhone 17e geometry.
appId: me.okoro.dialed
---
- tapOn: { id: 'add-start' }
- extendedWaitUntil: { visible: { id: 'add-start-wheel' }, timeout: 3000 }
- waitForAnimationToEnd: { timeout: 2000 }
- tapOn: { point: '30%,66%' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: { id: 'add-start' }
- waitForAnimationToEnd: { timeout: 2000 }
- assertVisible: { id: 'add-start', text: '.*9:00 pm.*' }
