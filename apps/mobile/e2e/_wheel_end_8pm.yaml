# Ends wheel: from 10 pm, tap the 8 row (two up), then tap the field again to close the wheel. iPhone 17e geometry.
appId: me.okoro.dialed
---
- tapOn: { id: 'add-end' }
- extendedWaitUntil: { visible: { id: 'add-end-wheel' }, timeout: 3000 }
- waitForAnimationToEnd: { timeout: 2000 }
- tapOn: { point: '30%,63%' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: { id: 'add-end' }
- waitForAnimationToEnd: { timeout: 2000 }
- assertVisible: { id: 'add-end', text: '.*8:00 pm.*' }
