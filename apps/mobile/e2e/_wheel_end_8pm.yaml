# Ends wheel: two rows down (10 pm → 8 pm), so the end is before the 9 pm start. iPhone 17e geometry.
appId: me.okoro.dialed
---
- tapOn: { id: 'add-end' }
- waitForAnimationToEnd: { timeout: 3000 }
- swipe: { start: '32%,36%', end: '32%,44%', duration: 900 }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: { point: '3%,62%' }
- waitForAnimationToEnd: { timeout: 2000 }
