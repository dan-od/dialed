# Flow 02: partial read → Found 4 classes, "Check these" stamp + marked cards, overlap note, term dates.
appId: me.okoro.dialed
---
- runFlow: _flow02_setup_open.yaml
- runFlow: _flow02_read.yaml
- extendedWaitUntil: { visible: 'Found 4 classes', timeout: 60000 }
- assertVisible: 'Check these: 2 times were hard to read.'
- assertVisible: 'Overlaps Capstone Study Project on Wednesday'
- assertVisible: 'Add 4 classes to Fall term'
- waitForAnimationToEnd: { timeout: 2000 }
- takeScreenshot: partial-${THEME}
- scrollUntilVisible: { element: 'Term ends', direction: DOWN }
- takeScreenshot: partial-dates-${THEME}
- tapOn: 'Pick another'
- extendedWaitUntil: { visible: 'Take a photo', timeout: 5000 }
- tapOn: 'Cancel'
