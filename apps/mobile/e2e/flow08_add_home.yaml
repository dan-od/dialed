# Flow 08 setup (once per Simulator): add the Now and Up next home widgets from iOS's widget gallery.
appId: com.apple.springboard
---
- runFlow: _flow08_gallery.yaml
- tapOn: " Add Widget"
- waitForAnimationToEnd
- runFlow: _flow08_gallery.yaml
- swipe: { start: "85%,58%", end: "15%,58%", duration: 300 }
- extendedWaitUntil: { visible: "Dialed, Up next", timeout: 5000 }
- tapOn: " Add Widget"
- waitForAnimationToEnd
- tapOn: "Done"
