# Flow 03 Day states at the prototype's clock points on its sample day (Mon Oct 19, 2026), from the owner's
# seeded routine in Postgres. Dev-only: a long-press on the date cycles the clock (compiled out of release).
appId: me.okoro.dialed
---
- runFlow: _relaunch.yaml
- runFlow: { file: _clock.yaml, env: { NAME: 'day-1315-${THEME}' } }
- runFlow: { file: _clock.yaml, env: { NAME: 'day-free-2020-${THEME}' } }
- runFlow: { file: _clock.yaml, env: { NAME: 'day-done-2330-${THEME}' } }
# back to the real clock
- longPressOn: 'Mon 19 Oct'
