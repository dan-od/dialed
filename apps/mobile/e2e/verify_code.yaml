# Flow 01 happy path, part 2: wrong code (failure path) → right code → empty-Day setup chooser (C-0102).
appId: me.okoro.dialed
---
- tapOn: { id: verify-code }
- inputText: ${WRONG}
- extendedWaitUntil:
    visible: That code doesn’t match. Check the newest email from Dialed.
    timeout: 15000
- takeScreenshot: verify-wrong
- tapOn: { id: verify-code }
- inputText: ${CODE}
- extendedWaitUntil:
    visible: Set up your week
    timeout: 90000
- assertVisible: 'Add your timetable.*'
- assertVisible: 'Build it myself.*'
- takeScreenshot: setup
