# Flow 04 build seed: add "Capstone reading" every <today's weekday>; the Day shows it with a New chip.
# Cleans up: Every <weekday> → Delete block → Undo (Put back) → Delete block again.
appId: me.okoro.dialed
---
- runFlow: _today.yaml
- runFlow: _open_add.yaml
- takeScreenshot: add-blank-${THEME}
- tapOn: { id: 'add-name' }
- inputText: 'Capstone reading'
- pressKey: Enter
- waitForAnimationToEnd: { timeout: 2000 }
- tapOn: { id: 'add-category' }
- extendedWaitUntil: { visible: 'Category', timeout: 5000 }
- takeScreenshot: cat-${THEME}
- tapOn: 'Study'
- extendedWaitUntil: { visible: 'Category, Study.*', timeout: 5000 }
- tapOn: { id: 'add-repeat' }
- takeScreenshot: add-filled-${THEME}
- runFlow: _add_save.yaml
- extendedWaitUntil: { visible: 'Edit Capstone reading.*, new', timeout: 5000 }
- assertVisible: 'Added to every .*'
- takeScreenshot: add-saved-new-${THEME}
- runFlow: _rest_to_bottom.yaml
- tapOn: 'Edit Capstone reading.*'
- extendedWaitUntil: { visible: 'Edit block', timeout: 5000 }
- tapOn: { id: 'edit-scope-every' }
- assertVisible: 'Delete block'
- tapOn: { id: 'edit-remove' }
- extendedWaitUntil: { visible: 'Deleted Capstone reading.', timeout: 5000 }
- takeScreenshot: delete-undo-${THEME}
- tapOn: 'Undo'
- extendedWaitUntil: { visible: 'Put back.', timeout: 5000 }
- extendedWaitUntil: { notVisible: 'Put back.', timeout: 8000 }
- runFlow:
    when: { notVisible: 'Edit Capstone reading.*' }
    commands:
      - runFlow: _rest_to_bottom.yaml
- extendedWaitUntil: { visible: 'Edit Capstone reading.*', timeout: 5000 }
- runFlow: _rest_to_bottom.yaml
- tapOn: 'Edit Capstone reading.*'
- extendedWaitUntil: { visible: 'Edit block', timeout: 5000 }
- tapOn: { id: 'edit-scope-every' }
- assertVisible: 'Delete block'
- tapOn: { id: 'edit-remove' }
- extendedWaitUntil: { visible: 'Deleted Capstone reading.', timeout: 5000 }
