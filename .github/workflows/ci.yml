name: ci
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      FLOW_BY_FLOW_REPORT_DIR: evidence/verification
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      # Bootstrap = deps + Postgres 16 (compose) + migrate + seed, twice (second run must change nothing).
      - run: ./scripts/bootstrap
      - run: ./scripts/bootstrap | tail -1 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{if(JSON.parse(s).changed)process.exit(1)})'
      - run: ./scripts/ci

  mobile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mobile run typecheck && pnpm --filter mobile run lint && pnpm --filter mobile test
      - name: expo prebuild --clean
        working-directory: apps/mobile
        run: CI=1 npx expo prebuild --clean --platform ios --no-install
      # Widget target xcodebuild joins this job with Flow 08 (optional until then).
