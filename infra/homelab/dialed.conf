# Dialed API — copy to /opt/docker-homelab/nginx/sites/dialed.conf (Homelab Hosting Playbook §6.3).
# Tunnel public hostname api.okoro.me → http://nginx-proxy:80 → this server block → dialed-api:8080.
# Real client IPs are set globally by 00-real-ip.conf; don't repeat that here.
server {
    listen 80;
    server_name api.okoro.me;

    # Resolve at request time through Docker DNS, so nginx-proxy still starts
    # (and every other site stays up) if this container is down or not built yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://dialed-api:8080;

    # Timetable photo uploads.
    client_max_body_size 20m;

    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}
